<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
  }
}
</script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level Construtora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Correção do Header para Desktop e Mobile */
    .header {
      position: relative;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      width: 100%;
      box-sizing: border-box;
      gap: 1rem;
    }

    .header .nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    /* Evita atrasos e bloqueios de toque no Canvas no iOS/iPhone */
    #canvas-container,
    #canvas-container canvas {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Garante que o overlay de detalhes funcione e role suavemente no iPhone */
    #detail-overlay {
      -webkit-overflow-scrolling: touch;
    }

    #detail-overlay.active-detail {
      pointer-events: auto !important;
      z-index: 999 !important;
    }

    /* Responsividade para Celular (resolve a sobreposição da logo) */
    @media (max-width: 768px) {
      .header {
        padding: 1.25rem 1.25rem !important;
      }

      .header .site-logo,
      .detail-header .site-logo {
        height: 36px !important;
        max-width: 120px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .header .nav {
        position: static !important;
        transform: none !important;
        margin-left: auto;
      }

      #open-search-btn {
        font-size: 0.75rem !important;
        padding: 0.5rem 0.9rem !important;
        white-space: nowrap;
      }

      .detail-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      #back-btn {
        font-size: 0.75rem !important;
        padding: 0.5rem 0.9rem !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader" class="loader">Carregando Galeria...</div>

    <!-- UI Layer -->
    <div class="ui-layer">
      <header class="header">
        <img class="site-logo" src="/images/logo.png" alt="Level Construtora" style="height: 48px;" onerror="this.style.display='none'" onload="this.style.display='block'">
        <div class="nav">
          <button id="open-search-btn" class="back-btn"
            style="padding: 0.5rem 1rem; border-color: rgba(255,255,255,0.4); background: transparent;">PESQUISAR
            PROJETOS</button>
        </div>
      </header>
    </div>

    <!-- Search Overlay -->
    <div id="search-overlay" class="admin-overlay">
      <div class="admin-modal" style="max-width: 400px; text-align: center;">
        <div class="admin-header" style="justify-content: center; position: relative;">
          <h2 style="margin: 0;">Medidas de Lote</h2>
          <button id="close-search-btn" class="close-btn"
            style="position: absolute; right: 0; top: -10px;">&times;</button>
        </div>
        <div id="search-options-container" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;">
        </div>
      </div>
    </div>

    <!-- Social Footer -->
    <footer class="social-footer">
      <div class="social-icons">
        <a href="#" id="link-instagram" target="_blank" aria-label="Instagram">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
        </a>
        <a href="#" id="link-facebook" target="_blank" aria-label="Facebook">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
        <a href="#" id="link-youtube" target="_blank" aria-label="YouTube">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>
        </a>
        <a href="#" id="link-whatsapp" target="_blank" aria-label="WhatsApp">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" />
            <path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" />
          </svg>
        </a>
      </div>
      <div class="footer-address">
        Avenida Centenário 520, Maringá - PR
      </div>
    </footer>

    <div id="canvas-container"></div>

    <div id="detail-overlay">
      <div class="detail-header">
        <button id="back-btn" class="back-btn">VOLTAR PARA GALERIA</button>
        <img class="site-logo" src="/images/logo.png" alt="Level Construtora" style="height: 48px;" onerror="this.style.display='none'" onload="this.style.display='block'">
      </div>
      <div class="detail-content">
        <h1 id="detail-title" class="detail-title">Project Name</h1>
        <p id="detail-subtitle" class="detail-subtitle">Location, Year</p>

        <div class="detail-grid">
          <div class="detail-text">
            <p id="detail-specs" style="margin-bottom: 1rem; color: #fff; font-weight: 500;"></p>
            <p id="detail-desc"></p>
          </div>
          <div id="detail-facades-container" style="display: flex; flex-direction: column; gap: 4rem;">
          </div>
          <div id="detail-plans-container"
            style="display: flex; flex-direction: column; gap: 4rem; margin-top: 2rem; border-top: 1px solid #333; padding-top: 4rem;">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
